{% extends 'base.html' %}
{% load static %}
{% block title %}
SellPhone
{% endblock %}
{% block content %}
<!--Page Title-->
<section class="page-title" style="background-image: url();">
    <div class="auto-container">
        <ul class="bread-crumb">
            <li><a href="{% url 'home:main' %}">Home</a></li>
            <li class="active">Sell</li>
            <li class="active">Sell Form</li>
        </ul>
        <h1>Sell Form</h1>
    </div>
</section>
<!--End Page Title-->

<!--Feedback-->
<div class="feedback-section">
    <div class="auto-container">
        <div class="row clearfix">
            <!--Content Side-->	
            <div class="content-side col-lg-8 col-md-8 col-sm-12 col-xs-12">
                <!--Feedback Form-->
                <div class="default-form feedback-form">
                    <!--Sec Title Two-->
                    <div class="sec-title-two">
                        <h2>Sell Form</h2>
                    </div>
                    <form method="post" action="{% url 'sell:category_form_view' %}">
                        {% csrf_token %}
                        <div class="row clearfix">
                            <!--Form Group-->
                            <div class="form-group country col-md-12 col-sm-12 col-xs-12">
                                <div class="field-label">Phone Model <sup>*</sup> </div>
                                <select class="form-control" name="phone_model">
                                    {% for x in category_data %}
                                    <option value="{{x.title}}">{{x.title}}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group country col-md-12 col-sm-12 col-xs-12">
                                <div class="field-label">condition <sup>*</sup> </div>
                                <select class="form-control" name="condition">
                                    {% for x in condition %}
                                    <option value="{{x.condition}}">{{x.condition}}</option>
                                    {% endfor %}
                                </select>
                                <div class="dropdown" id="dropdown-button-style">
                                <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="background-color:#2E4C66 ;">
                                    Discription
                                </button>
                                <div class="dropdown-menu" aria-labelledby="dropdownMenuButton" style="margin-top: -2em;">
                                    <a onclick="JSalert()" class="dropdown-item">good</a>
                                    <a onclick="JSalert1()" class="dropdown-item">fair</a>
                                    <a onclick="JSalert2()" class="dropdown-item">semi</a>
                                </div>
                                </div>
                            </div>
                            <div class="form-group country col-md-12 col-sm-12 col-xs-12">
                                <div class="field-label">storage <sup>*</sup> </div>
                                <select class="form-control" name="storage">
                                    {% for x in storage %}
                                    <option value="{{x.storage}}">{{x.storage}}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <!--Form Group-->
                            <div class="form-group text-left col-md-12 col-xs-12"><button type="submit" class="theme-btn btn-style-three">SUBMIT</button></div>
                        </div>
                    
                    </form>
                </div>
            </div>
            <!--Content Side-->
        </div>
    </div>
</div>
{% endblock %}
